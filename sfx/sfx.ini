; Phantasy Star IV port: your own sound effects.
; Used in Enhanced mode with "Sound effects: Your samples" (Esc > Settings).
; Sounds this file doesn't map use the port's own synthesized set ("Modern").
;
; Each line:  SOUND_ID = file or folder [, gain in dB]
;        or:  SOUND_ID = synth:RECIPE [, gain in dB]
; A folder plays one of its .wav files at random each time (never the same
; one twice in a row). Paths are relative to this folder. The samples stay
; out of git (they're yours, from your sample library). Recipes are the
; port's own sounds: slash, slasher, cursor, select (runtime/sfxsynth.c);
; psiv_headless --sfx-dump DIR writes them all as WAVs to listen to.
;
; Sound IDs are the game's SFXID_* values, in hex (see
; disasm/ps4disasm/ps4.constants.asm), for example:
;   F5 Sword   B7 Slasher   B5 Rod   B6 Shot   B8 AttackMiss   B9 EnemyKilled
;   F2 MovingCursor   F3 Selection   BB TechCast   BE Foi   C6 Zan   EC Lightning
; F5 is every blade hit: sword and dagger blows, and each enemy the slasher
; passes through (B7 is only Alys's throw).

[replace]
F5 = sword, -4        ; SFXID_Sword: every blade hit
B7 = boomerang, -4    ; SFXID_Slasher: Alys's slasher (a boomerang)
F2 = ui_nav.wav, -8   ; SFXID_MovingCursor: moving the menu cursor
